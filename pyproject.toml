[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualto"
version = "0.1.0"
description = "Claim-bound trading receipts for Binance Agent OS."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10.0"]
quality = [
    "build>=1.2,<2.0",
    "mypy>=1.14,<2.0",
    "pip-audit>=2.7,<3.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
qualto = "qualto.cli:main"

[tool.setuptools.packages.find]
include = ["qualto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["qualto", "tests"]
